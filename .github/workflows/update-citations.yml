name: Refresh Google Scholar citations

on:
  schedule:
    - cron: '23 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scholar-citations
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify refresh logic
        run: python -m unittest discover -s tests
      - name: Fetch public Scholar profile
        run: python scripts/update_citations.py
      - name: Update static publication markup
        run: python scripts/render_publications.py
      - name: Save refreshed cache
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/citations.json index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: refresh Google Scholar citations'
          git push origin HEAD:master
